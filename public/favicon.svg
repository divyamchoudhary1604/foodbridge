<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Bridge arch -->
  <path d="M8 40 Q32 12 56 40" stroke="#1f6b4f" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Bridge deck -->
  <line x1="4" y1="40" x2="60" y2="40" stroke="#1f6b4f" stroke-width="3" stroke-linecap="round"/>
  <!-- Left pillar -->
  <line x1="16" y1="40" x2="16" y2="52" stroke="#1f6b4f" stroke-width="3" stroke-linecap="round"/>
  <!-- Right pillar -->
  <line x1="48" y1="40" x2="48" y2="52" stroke="#1f6b4f" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaf on top of bridge -->
  <path d="M28 22 Q32 10 36 22 Q32 18 28 22Z" fill="#22c55e"/>
